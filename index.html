<!doctype html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Yoo Jin Pick</title>
<style>
:root{--bg:#f0f0f0;--fg:#444;--mut:#888;--line:#e0e0e0;--card:#fff;--img:#f8f8f6;--nv:#3d5a73;--sh:rgba(0,0,0,.09);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{background:#f0f0f0!important}html,body{background:#f0f0f0!important}
html{background:#f0f0f0;background:var(--bg);min-height:100%}body{min-height:100vh}
body{margin:0;background:#f0f0f0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",Helvetica,Arial,sans-serif;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#f0f0f0;background:var(--bg);z-index:10}
.pg{background:#f0f0f0;background:var(--bg);min-height:100vh;width:100%;padding-bottom:90px}
.w{width:min(92%,520px);margin:auto}
.logo{text-align:center;font:600 42px "Dancing Script",cursive;background:linear-gradient(90deg,#f0829a,#f7b3a6);-webkit-background-clip:text;background-clip:text;color:transparent;padding:26px 0 4px}
.so{display:flex;gap:22px;justify-content:center;padding:14px 0 20px}.so a{display:block;width:28px;height:28px}.so svg{width:100%;height:100%}
.br{width:100%;display:block;background:#f0f0f0;background:var(--bg);border:2px solid var(--line);border-radius:18px;box-shadow:0 2px 6px var(--sh);padding:18px 10px;margin:0 0 14px;font-weight:700;font-size:20px;font-family:inherit;color:var(--fg);cursor:pointer}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.pc{background:#fff;background:var(--card);border-radius:8px;padding:8px;box-shadow:0 1px 3px var(--sh);display:flex;flex-direction:column;align-items:center;text-align:center}
.pi{width:100%;aspect-ratio:1;border-radius:6px;background:#f8f8f6 center/contain no-repeat;background:var(--img) center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px}
.pc b{font-size:13px;line-height:1.3;margin:8px 0;flex:1;color:var(--fg)}
.vb{background:#3d5a73;background:var(--nv);color:#fff;border:0;border-radius:20px;padding:8px 20px;font:inherit;font-size:14px;cursor:pointer}
.ed{background:none;border:0;color:#888;font-size:12px;margin-top:6px;cursor:pointer}
.pc.add{border:2px dashed #ccc;background:none;box-shadow:none;justify-content:center;min-height:150px;color:#999;font-size:32px;cursor:pointer}.pc.add small{font-size:12px;color:#999}
.fb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:90%}
.fb .vb{box-shadow:0 2px 8px var(--sh)}
.ft{text-align:center;padding:10px 0 20px}.ft a{color:var(--mut);font-size:13px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20}
#sh{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,440px);max-height:90%;overflow:auto;background:#fff;background:var(--card);border-radius:18px;padding:22px 20px 24px;display:none;z-index:21}
.x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer;line-height:1}
.lg{text-align:center;font:600 24px "Dancing Script",cursive;color:#f0829a;margin-bottom:12px}
.cr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;border-radius:10px;scrollbar-width:none}.cr::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/2;background:#f8f8f6 center/contain no-repeat;background:var(--img) center/contain no-repeat;border-radius:10px}
.dt{display:flex;gap:8px;justify-content:center;margin:14px 0}.dt i{width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}.dt i.on{background:#3d5a73;background:var(--nv)}
.nm{text-align:center;font-size:22px;font-weight:700;color:var(--fg);margin:6px 0 8px}.pr{text-align:center;font-size:17px;color:var(--fg);margin-bottom:14px}hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.btn{width:100%;padding:14px;border-radius:24px;border:1px solid var(--nv);background:#3d5a73;background:var(--nv);color:#fff;font:inherit;font-weight:500;cursor:pointer;margin-top:10px}
.btn.o{background:none;color:var(--fg);border-color:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.q{display:flex;align-items:center;gap:10px}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:#f0f0f0;background:var(--bg);color:var(--fg);font:inherit;margin-top:8px}
.d{white-space:pre-wrap;color:var(--mut);margin:10px 0 4px}.t{font-size:18px;font-weight:600}small{color:var(--mut)}.empty{padding:40px 0;text-align:center;color:var(--mut)}

.lg-img{display:block;margin:22px auto 4px;height:64px;max-width:80%;object-fit:contain}.so a{width:30px;height:30px}.so img{width:100%;height:100%;object-fit:contain;border-radius:6px}
#sh .lg-img{height:40px;margin:0 auto 12px}.pi img,.sl img{width:100%;height:100%;object-fit:contain}.sl{display:flex;align-items:center;justify-content:center}
s{color:#999;font-size:13px}.pw{text-align:center;margin-bottom:12px}.pw b{font-size:18px;color:var(--fg)}
.d ul{padding-left:18px;margin:8px 0}.d h4{margin:14px 0 4px;color:var(--fg)}.d{white-space:normal}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}.ok{text-align:center}.cd{font-size:26px;font-weight:700;letter-spacing:.08em;margin:8px 0;color:var(--nv)}
.bk{background:var(--img);border-radius:8px;padding:12px;margin:12px 0;font-weight:600;white-space:pre-wrap}.hp{position:absolute;left:-9999px}
.ed{background:none;border:0;color:#888;font-size:12px;margin-top:6px;cursor:pointer}
.pc.add{border:2px dashed #ccc;background:none;box-shadow:none;justify-content:center;min-height:150px;color:#999;font-size:32px;cursor:pointer}.pc.add small{font-size:12px;color:#999}
#adm{position:fixed;left:0;right:0;top:0;z-index:15;background:#3d5a73;color:#fff;font-size:12px;text-align:center;padding:4px}#adm a{color:#fff;margin-left:10px;text-decoration:underline;cursor:pointer}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
</style></head><body>
<div class="pg"><div class="w">
<img class="lg-img" src="img/yoojinpick.png" alt="Yoo Jin Pick">
<div class="so">
<a href="https://www.facebook.com/share/1JFkHKYCg4/?mibextid=wwXIfr" target="_blank" rel="noopener"><img src="img/facebook.png" alt="Facebook"></a>
<a href="https://www.instagram.com/somya___ag?igsh=Zm4xbnU1ZnIwNXNz&amp;utm_source=qr" target="_blank" rel="noopener"><img src="img/instagram.png" alt="Instagram"></a>
<a href="https://youtube.com/@khatadfilm7377?si=VFGZ3WNEGclvbdeK" target="_blank" rel="noopener"><img src="img/youtube.png" alt="YouTube"></a>
<a href="https://lite.tiktok.com/t/ZSr7t6a2C/" target="_blank" rel="noopener"><img src="img/tiktok.png" alt="TikTok"></a>
</div>
<div id="bl"></div>
</div></div>
<div class="fb"><button class="vb" data-a="cart">Сагс <span id="cn">0</span></button></div>
<div id="ts"></div><div id="ov" data-a="close"></div><div id="sh"></div>
<script src="config.js"></script><script src="products.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#ts");t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1600)}
const fmt=s=>!s?"":/</.test(s)?s:E(s).replace(/\n/g,"<br>");
const W=n=>Number(n).toLocaleString()+" вон";
let cart={},op={},admin=false;try{cart=JSON.parse(localStorage.getItem("nrcart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("nrcart",JSON.stringify(cart))}catch(e){}};
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function render(){$("#cn").textContent=cnt();
 $("#bl").innerHTML=BRANDS.map((b,bi)=>{const L=PRODUCTS.map((p,i)=>[p,i]).filter(x=>x[0].brand==b);
  const tiles=L.length?L.map(([p,i])=>`<div class="pc"><div class="pi"><img src="${p.cover}" alt="${E(p.name)}" loading="lazy"></div><b>${E(p.name)}</b><button class="vb" data-a="view" data-i="${i}">View</button>${admin?`<button class="ed" data-a="edit" data-i="${i}">수정</button>`:""}</div>`).join(""):`<div class="pc"><div class="pi"><img src="img/nr_logo.png" alt=""></div><b>Coming Soon</b></div>`;
  return `<button class="br" data-a="tg" data-i="${bi}">${E(b)}</button>`+(op[b]?`<div class="pl">${tiles}${admin?`<div class="pc add" data-a="newp" data-i="${bi}">+<small>상품 추가</small></div>`:""}</div>`:"")}).join("")}
function show(h){$("#sh").innerHTML='<button class="x" data-a="close">×</button>'+h;$("#sh").scrollTop=0;$("#sh").style.display=$("#ov").style.display="block"}
const price=p=>p.price?`<div class="pw">${p.orig?`<s>Борлуулалтын үнэ ${W(p.orig)}</s><br>`:""}<b>Хямдралтай үнэ ${W(p.price)}</b></div>`:`<div class="pw"><b>Үнэ лавлах</b></div>`;
const A={
 close(){$("#sh").style.display=$("#ov").style.display="none"},
 tg(i){const b=BRANDS[i];op[b]=!op[b];render()},
 view(i){const p=PRODUCTS[i];
  show(`<img class="lg-img" src="img/yoojinpick.png" alt=""><div class="cr" id="cr">${p.imgs.map(s=>`<div class="sl"><img src="${s}" alt=""></div>`).join("")}</div>
  <div class="dt">${p.imgs.length>1?p.imgs.map((_,k)=>`<i class="${k?"":"on"}" data-a="dot" data-i="${k}"></i>`).join(""):""}</div>
  <div class="nm">${E(p.name)}</div>${price(p)}<hr><div class="d">${fmt(p.desc)}</div>
  ${p.price?`<button class="btn" data-a="add" data-i="${i}">Сагсанд нэмэх</button>`:`<a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://www.facebook.com/share/1JFkHKYCg4/?mibextid=wwXIfr" target="_blank" rel="noopener">Асуух (Facebook)</a>`}`);
  const c=$("#cr");c.onscroll=()=>{const k=Math.round(c.scrollLeft/c.clientWidth);document.querySelectorAll(".dt i").forEach((d,j)=>d.classList.toggle("on",j==k))}},
 dot(k){const c=$("#cr");c.scrollTo({left:k*c.clientWidth,behavior:"smooth"})},
 add(i){cart[i]=(cart[i]||0)+1;save();render();A.close();toast("Сагсанд нэмэгдлээ ✓")},
 q(i,el){const d=+el.dataset.d;cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];save();render();A.cart()},
 cart(){const it=Object.keys(cart).map(i=>[PRODUCTS[i],cart[i],i]).filter(x=>x[0]);const tot=it.reduce((a,[p,n])=>a+p.price*n,0);
  show(`<div class="t">Сагс</div>`+(it.length?it.map(([p,n,i])=>`<div class="row"><div>${E(p.name)}<br><small>${W(p.price)}</small></div><div class="q"><button data-a="q" data-i="${i}" data-d="-1">−</button>${n}<button data-a="q" data-i="${i}" data-d="1">+</button></div></div>`).join("")+`<div class="row"><b>Нийт</b><b>${W(tot)}</b></div><button class="btn" data-a="form">Захиалах</button>`:`<div class="empty">Сагс хоосон байна.</div>`))},
 form(){show(`<div class="t">Захиалга</div><label>Нэр</label><input id="fn" maxlength="80"><label>Утасны дугаар</label><input id="fp" type="tel" maxlength="30"><label>Хаяг</label><textarea id="fa" rows="3" maxlength="300"></textarea><label>Нэмэлт тайлбар (заавал биш)</label><input id="fm" maxlength="300"><input class="hp" id="fw" tabindex="-1" autocomplete="off"><div id="fe" style="color:#c33;font-size:13px;margin-top:8px"></div><button class="btn" data-a="send">Захиалга баталгаажуулах</button><button class="btn o" data-a="cart">← Буцах</button>`)},
 async send(i,btn){const v=id=>$(id).value.trim(),name=v("#fn"),phone=v("#fp"),address=v("#fa"),er=$("#fe");
  if(!name||phone.replace(/\D/g,"").length<8||!address){er.textContent="Нэр, утасны дугаар, хаягаа зөв бөглөнө үү.";return}
  if(typeof ORDER_URL!=="string"){er.textContent="Алдаа: config.js файлд алдаа байна (ORDER_URL).";return}
  const items=Object.keys(cart).map(i=>({name:PRODUCTS[i].name,qty:cart[i],price:PRODUCTS[i].price})),total=items.reduce((a,x)=>a+x.price*x.qty,0),code="NR-"+Date.now().toString(36).slice(-4).toUpperCase();
  btn.disabled=true;btn.textContent="...";er.textContent="";
  const url=ORDER_URL.trim(),init={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({code,name,phone,address,note:v("#fm"),items,total,website:v("#fw")})};
  try{if(url){try{const r=await fetch(url,init),j=await r.json();if(!j.ok)throw new Error("rejected")}catch(e){if(e.message==="rejected")throw e;await fetch(url,{...init,mode:"no-cors"})}}}
  catch(e){btn.disabled=false;btn.textContent="Захиалга баталгаажуулах";er.textContent="Алдаа гарлаа. Дахин оролдоно уу. ("+e.name+": "+e.message+")";return}
  cart={};save();render();
  const BK=(typeof BANK!=="undefined"&&Array.isArray(BANK))?BANK:[];
  show(`<div class="ok"><div class="t">Захиалга бүртгэгдлээ</div><div class="cd">${code}</div><p class="d">Доорх данс руу <b>${W(total)}</b> шилжүүлж, гүйлгээний утга дээр дээрх кодыг бичнэ үү.</p><div class="bk">${E(BK.join("\n"))}</div><p class="d">Төлбөр орсны дараа бид тантай холбогдоно.${url?"":"<br>(테스트 모드: 주문이 전송되지 않았어요)"}</p><button class="btn" data-a="close">Хаах</button></div>`)}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.i,t)});
render();
if(location.hash==="#admin"){const s=document.createElement("script");s.src="admin.js";document.body.appendChild(s)}
</script></body></html>
